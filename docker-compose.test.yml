services:
  postgres-test:
    restart: "no"
    image: postgres:16-alpine
    container_name: buildpay-postgres-test
    environment:
      POSTGRES_DB: buildpay_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: buildpay_test_password_2024
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend-test:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildpay-backend-test
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://postgres:buildpay_test_password_2024@postgres-test:5432/buildpay_test
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FRONTEND_URL=http://localhost:3000
      - SEED_DEMO_DATA=true
    ports:
      - "8001:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
